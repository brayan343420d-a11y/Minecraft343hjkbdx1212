name: Build ENA Curtain

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Encontrar y extraer proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "Usando: $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

          echo "Contenido:"
          find project -maxdepth 3 -type f

      - name: Compilar
        working-directory: project
        run: |
          gradle build --no-daemon --no-build-cache

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ena-curtain
          path: project/build/libs/*.jar          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          ls -la

          gradle build --no-build-cache --rerun-tasks

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "project/**/build/libs/*.jar"          cd "$PROJECT_DIR"
          gradle build --no-build-cache --rerun-tasks

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "**/build/libs/*.jar"
