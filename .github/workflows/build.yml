name: Build mod

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar el mod
        run: ./gradlew build --no-build-cache --rerun-tasks

      - name: Subir el .jar como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: build/libs/*.jar
