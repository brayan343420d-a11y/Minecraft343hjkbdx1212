name: Build ENA Curtain

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Encontrar ZIP del proyecto
        id: findzip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraer proyecto
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "${{ steps.findzip.outputs.zip }}" -d project

          echo "Comprobando proyecto..."

          test -f project/build.gradle
          test -f project/settings.gradle
          test -f project/gradle.properties

          echo "Proyecto encontrado correctamente."

      - name: Compilar
        working-directory: project
        run: |
          gradle clean build \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Verificar JAR
        working-directory: project
        run: |
          set -e

          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*sources.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó ningún JAR."
            ls -lah build/libs
            exit 1
          fi

          echo "JAR encontrado:"
          ls -lh "$JAR"

          SIZE=$(stat -c%s "$JAR")

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: El JAR pesa menos de 1 KB."
            exit 1
          fi

          unzip -l "$JAR" | grep -q "fabric.mod.json"
          unzip -l "$JAR" | grep -q "EnaCurtainMod.class"
          unzip -l "$JAR" | grep -q "EnaCurtainClient.class"
          unzip -l "$JAR" | grep -q "HeldItemRendererMixin.class"

          echo "JAR VERIFICADO CORRECTAMENTE."

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ena-curtain-mod
          path: project/build/libs/*.jar
          if-no-files-found: error
