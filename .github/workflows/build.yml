name: Build mod

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Encontrar proyecto Gradle
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Proyecto encontrado en la raíz."
            PROJECT_DIR="."
          fi

          echo "Proyecto Gradle: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar el mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-build-cache --rerun-tasks

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "**/build/libs/*.jar"
