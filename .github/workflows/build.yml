name: Build mod

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Encontrar y descomprimir proyecto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          echo "ZIP encontrado: $ZIP"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No hay ningún ZIP."
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Proyecto extraído:"
          find project -maxdepth 4 -type f | sort

      - name: Encontrar proyecto Gradle
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto Gradle encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar el mod
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          ls -la

          gradle build --no-build-cache --rerun-tasks

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "project/**/build/libs/*.jar"          cd "$PROJECT_DIR"
          gradle build --no-build-cache --rerun-tasks

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "**/build/libs/*.jar"
