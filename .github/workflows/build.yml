name: Build mod

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          echo "Contenido del repositorio:"
          find . -maxdepth 3 -type f | sort

          # Si el proyecto fue subido como ZIP, lo extraemos.
          if [ -f "ena-curtain-fabric-1.20.1-GITHUB.zip" ]; then
            echo "Encontrado project-source.zip"
            mkdir -p project
            unzip -o "project-source.zip" -d project
          fi

          # Buscar settings.gradle
          SETTINGS=$(find . -type f -name "settings.gradle" \
            -not -path "./.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            echo "Archivos encontrados:"
            find . -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Contenido del proyecto:"
          ls -la "$PROJECT_DIR"

      - name: Compilar el mod
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle build --no-build-cache --rerun-tasks

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: spawnintro-jar
          path: "**/build/libs/*.jar"
